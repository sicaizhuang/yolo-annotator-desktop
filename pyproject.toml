[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-annotator-desktop"
version = "0.3.0"
description = "A fast, local-first desktop bounding-box annotator for YOLO datasets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "YOLO Annotator Desktop contributors"}]
keywords = ["yolo", "annotation", "computer-vision", "dataset", "tkinter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["Pillow>=10.0", "PyYAML>=6.0"]

[project.scripts]
yolo-annotator-desktop = "yolo_annotator_desktop.__main__:main"
yad-qc = "yolo_annotator_desktop.cli:qc_main"
yad-export = "yolo_annotator_desktop.cli:export_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
