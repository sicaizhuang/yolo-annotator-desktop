[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-annotator-desktop"
version = "0.5.0"
description = "Desktop YOLO annotation tool for detection, OBB, segmentation, pose, and classification datasets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "YOLO Annotator Desktop contributors"}]
keywords = [
  "yolo",
  "annotation",
  "labeling",
  "image-annotation",
  "object-detection",
  "oriented-bounding-box",
  "obb",
  "segmentation",
  "pose-estimation",
  "classification",
  "computer-vision",
  "dataset",
  "ultralytics",
  "tkinter",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = ["Pillow>=10.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://sicaizhuang.github.io/yolo-annotator-desktop/"
Repository = "https://github.com/sicaizhuang/yolo-annotator-desktop"
Issues = "https://github.com/sicaizhuang/yolo-annotator-desktop/issues"
Changelog = "https://github.com/sicaizhuang/yolo-annotator-desktop/blob/main/CHANGELOG.md"

[project.gui-scripts]
yolo-annotator-desktop = "yolo_annotator_desktop.__main__:main"

[project.scripts]
yad-qc = "yolo_annotator_desktop.cli:qc_main"
yad-export = "yolo_annotator_desktop.cli:export_main"
yad-create = "yolo_annotator_desktop.cli:create_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
